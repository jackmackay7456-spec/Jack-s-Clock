    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #000; }
    body {
      color: #fff;
      font-family: "Anthropic Sans", sans-serif;
      font-weight: 400;
      display: grid;
      place-items: center;
      min-height: 100svh;
      overflow: hidden;
    }
    #clock {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.22em;
      white-space: nowrap;
      font-family: "Anthropic Sans", sans-serif;
      font-size: min(15vw, 31vh);
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #period { font-size: 0.27em; }
    #controls {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      right: max(24px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 48px);
      transition: opacity 0.7s ease;
    }
    #fullscreen, #font-selector {
      min-width: 0;
      padding: 10px 16px;
      border: 1px solid #555;
      border-radius: 8px;
      color: #ddd;
      background: #141414;
      font: 400 14px "Anthropic Sans", sans-serif;
      cursor: pointer;
      transition: opacity 0.7s ease;
    }
    #font-selector { width: 220px; max-width: 45vw; color-scheme: dark; }
    #controls.hidden { opacity: 0; pointer-events: none; }
    #controls:has(:focus-visible) { opacity: 1; pointer-events: auto; }
    #controls :focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) { #controls, #fullscreen, #font-selector { transition: none; } }
  
    body { height: 100dvh; min-height: 0; padding: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-right, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 16px) calc(env(safe-area-inset-left, 0px) + 16px); }
    #clock { width: max-content; }
    #controls { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); right: calc(env(safe-area-inset-right, 0px) + 16px); left: calc(env(safe-area-inset-left, 0px) + 16px); max-width: none; flex-wrap: wrap; justify-content: flex-end; }
    #font-selector, #fullscreen { min-height: 44px; font-size: 16px; }
    #font-selector { max-width: 100%; flex: 0 1 220px; }
    #offline-status { flex-basis: 100%; text-align: right; font: 12px sans-serif; color: #999; }
    [hidden] { display: none !important; }
  </style>

  <script>
    const time = document.getElementById('time');
    const period = document.getElementById('period');
    const button = document.getElementById('fullscreen');
    const controls = document.getElementById('controls');
    const selector = document.getElementById('font-selector');
    const clock = document.getElementById('clock');
    // Fit the actual chosen font; unusual wide fonts must also stay inside safe areas.
    function fitClock() {
      const style = getComputedStyle(document.body);
      const width = document.body.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = document.body.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      const base = Math.min(width * .15, height * .31);
      clock.style.fontSize = base + 'px';
      const box = clock.getBoundingClientRect();
      clock.style.fontSize = base * Math.min(1, width / box.width, height / box.height) * .98 + 'px';
    }
    window.addEventListener('resize', fitClock);
    window.visualViewport?.addEventListener('resize', fitClock);
    document.fonts?.addEventListener('loadingdone', fitClock);
    const storageKey = 'offline-clock-selected-font';
    function applyFont() {
      clock.style.fontFamily = '"' + selector.selectedOptions[0].dataset.family + '", sans-serif';
      requestAnimationFrame(fitClock);
    }
    try {
      const saved = localStorage.getItem(storageKey);
      if (saved && Array.from(selector.options).some(option => option.value === saved)) selector.value = saved;
    } catch { /* Keep the clock working if browser storage is unavailable. */ }
    applyFont();
    selector.addEventListener('change', () => {
      applyFont();
      try { localStorage.setItem(storageKey, selector.value); } catch {}
      revealButton();
    });
    const pad = number => String(number).padStart(2, '0');
    let tickTimer;
    function tick() {
      clearTimeout(tickTimer);
      const now = new Date();
      time.textContent = `${now.getHours() % 12 || 12}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      period.textContent = now.getHours() < 12 ? 'AM' : 'PM';
      fitClock();
      tickTimer = setTimeout(tick, 1000 - Date.now() % 1000);
    }
    tick();
    document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
    window.addEventListener("pageshow", tick);
    let fadeTimer;
    function revealButton() {
      controls.classList.remove('hidden');
      clearTimeout(fadeTimer);
      fadeTimer = setTimeout(() => controls.classList.add('hidden'), 2500);
    }
    document.addEventListener('pointermove', revealButton);
    document.addEventListener('pointerdown', revealButton);
    document.addEventListener('keydown', revealButton);
    document.addEventListener('fullscreenchange', () => {
      button.textContent = document.fullscreenElement ? 'Exit fullscreen' : 'Enter fullscreen';
      revealButton();
    });
    button.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch {
        button.textContent = 'Use Brave’s View → Enter Full Screen';
      }
      revealButton();
    });
    if (!document.fullscreenEnabled) button.hidden = true;
    const status = document.getElementById('offline-status');
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      status.textContent = 'Preparing offline fonts…';
      navigator.serviceWorker.register('./sw.js', {scope: './'}).then(reg => {
        const ready = () => { status.textContent = 'Ready offline · all fonts saved'; };
        if (reg.active) ready();
        const watch = worker => worker?.addEventListener('statechange', () => {
          if (worker.state === 'activated') ready();
          if (worker.state === 'redundant' && !reg.active) status.textContent = 'Offline setup failed · reload online to retry';
        });
        watch(reg.installing);
        reg.addEventListener('updatefound', () => watch(reg.installing));
      }).catch(() => { status.textContent = 'Offline unavailable · clock still works online'; });
    }
    revealButton();
  </script>
</body>
</html>
